name: Archive Traffic & Stats

on:
  schedule:
    # Run once daily at 00:05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  administration: read

jobs:
  archive-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run traffic archiver
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/archive-traffic.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/stats/traffic.json docs/STATS.md
          if git diff --staged --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "chore(stats): update traffic and download metrics [skip ci]"
            git push origin main
          fi
