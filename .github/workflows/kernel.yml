name: Kernel 7.2.8 (self-build)

# Builds linux-7.2.8 from kernel.org with the reference config and the patch set, so the image stops carrying an
# Image that was built elsewhere. The gate job proves the result is equivalent to what we ship today.

on:
  push:
    branches: ['local/immortalwrt-ci']
    paths: ['.github/workflows/kernel.yml']
  workflow_dispatch:
    inputs:
      kernel:
        description: 'Kernel release to build (linux-<version>.tar.xz from cdn.kernel.org)'
        required: false
        default: '7.2.8'
      base_config:
        description: 'mainline (allnoconfig + our fragments) or kano (the carried kernel own config)'
        required: false
        default: 'mainline'
      tag:
        description: 'Release tag to attach Image + modules to (empty: artifact only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler xz-utils lz4 python3
      - name: Fetch and verify the source
        env:
          KV: ${{ inputs.kernel || '7.2.8' }}
        run: |
          set -eu
          base=https://cdn.kernel.org/pub/linux/kernel/v${KV%%.*}.x
          curl -fsSLO "$base/linux-$KV.tar.xz"
          curl -fsSL "$base/sha256sums.asc" | grep " linux-$KV.tar.xz\$" | sha256sum -c -
          tar -xJf "linux-$KV.tar.xz"
          echo "src=linux-$KV" >> "$GITHUB_ENV"
      - name: Apply the patch set
        run: |
          set -eu
          cd "$src"
          for p in $GITHUB_WORKSPACE/upstream/patches/*.patch $GITHUB_WORKSPACE/upstream/patches/$(echo "${{ inputs.kernel || '7.2.8' }}" | cut -d. -f1,2)/*.patch; do
            [ -f "$p" ] || continue
            if patch -p1 -N -s --dry-run < "$p" >/dev/null 2>&1; then patch -p1 -N -s < "$p"
            elif patch -p1 -R -s -f --dry-run < "$p" >/dev/null 2>&1; then :
            else echo "patch does not apply: $p" >&2; exit 1; fi
          done
      - name: Install the vendor port (ums9620 clk, ssphy, pmdomain, ...)
        run: |
          set -eu
          cd "$src"
          # The author tree keeps the drivers mainline does not have in upstream/port and installs them with
          # install.py (it appends the Kconfig entries and Makefile lines too). Without this step the ums9620
          # clock controller and the USB3 SS PHY do not exist, which is exactly what the probe dump showed.
          python3 "$GITHUB_WORKSPACE/upstream/port/install.py" . 2>&1 | tail -12
          grep -n "SPRD_UMS9620_CLK" drivers/clk/sprd/Kconfig drivers/clk/sprd/Makefile | head -4

      - name: Configure
        env:
          BASE_CONFIG: ${{ inputs.base_config || 'mainline' }}
        run: |
          set -eu
          cd "$src"
          O=$PWD/out && mkdir -p "$O"
          if [ "$BASE_CONFIG" = kano ]; then
            # The carried kernel's own config: same struct module layout, so its prebuilt out-of-tree modules
            # (sipa, sprd_wlan_combo) insert instead of failing the section-size check.
            cp "$GITHUB_WORKSPACE/upstream/kano-7.2.8.config" "$O/.config"
            make O="$O" ARCH=arm64 olddefconfig >/dev/null
            echo "base config: kano"
          else
          make O="$O" ARCH=arm64 allnoconfig >/dev/null
          CFG=""; for c in upstream/mu300-mainline.config work/mu300-mainline.config upstream/kernel/mu300-mainline.config; do [ -f "$GITHUB_WORKSPACE/$c" ] && { CFG="$GITHUB_WORKSPACE/$c"; break; }; done
          [ -n "$CFG" ] || { echo "no mainline config in this tree (upstream/mu300-mainline.config)" >&2; exit 1; }
          ./scripts/kconfig/merge_config.sh -m -O "$O" "$O/.config" "$CFG" >/dev/null
          # the USB stack the carried kernel has and the mainline config does not (all USB modules failed without it)
          USB="$GITHUB_WORKSPACE/boot/kernel-fragments/usb.config"
          [ -f "$USB" ] && ./scripts/kconfig/merge_config.sh -m -O "$O" "$O/.config" "$USB" >/dev/null
          # the clock/PMIC providers must be built in, or every consumer fails "can't get the clock"
          CLKSOC="$GITHUB_WORKSPACE/boot/kernel-fragments/clk-soc.config"
          [ -f "$CLKSOC" ] && ./scripts/kconfig/merge_config.sh -m -O "$O" "$O/.config" "$CLKSOC" >/dev/null
          # Firmware the rootfs should not have to carry: whatever sits in boot/firmware/ is linked INTO the kernel
          # (CONFIG_EXTRA_FIRMWARE), so a fresh rootfs needs nothing in /lib/firmware for it.
          FW="$GITHUB_WORKSPACE/boot/firmware"
          if [ -d "$FW" ] && [ -n "$(ls -A "$FW" 2>/dev/null)" ]; then
            LIST=$(cd "$FW" && ls -1 | tr '\n' ' ')
            printf 'CONFIG_EXTRA_FIRMWARE="%s"\nCONFIG_EXTRA_FIRMWARE_DIR="%s"\n' "$LIST" "$FW" > "$O/fw.config"
            ./scripts/kconfig/merge_config.sh -m -O "$O" "$O/.config" "$O/fw.config" >/dev/null
            echo "extra firmware embedded: $LIST"
          else
            echo "no boot/firmware/ content yet: firmware stays a rootfs item"
          fi
          CLK="$GITHUB_WORKSPACE/boot/kernel-fragments/clk.config"
          [ -f "$CLK" ] && ./scripts/kconfig/merge_config.sh -m -O "$O" "$O/.config" "$CLK" >/dev/null
          make O="$O" ARCH=arm64 olddefconfig >/dev/null
          fi
          echo "--- effective clock/PMIC config ---"
          grep -E 'CONFIG_(ARCH_SPRD|SPRD|SC27|COMMON_CLK|SPMI|REGULATOR)' "$O/.config" | grep -v '^#' | sort | head -40 || true
          make O="$O" ARCH=arm64 olddefconfig >/dev/null
          echo "out=$O" >> "$GITHUB_ENV"
      - name: Build Image and modules
        run: |
          set -eu
          cd "$src"
          make O="$out" ARCH=arm64 -j"$(nproc)" Image modules
          ls -l "$out/arch/arm64/boot/Image"
          strings "$out/arch/arm64/boot/Image" | sed -n 's/^Linux version \([^ ]*\) .*/built kernel: \1/p' | head -1
      - name: Package the kernel bundle inputs
        run: |
          set -eu
          mkdir -p dist/modules
          cp "$out/arch/arm64/boot/Image" dist/Image
          find "$out" -name '*.ko' -exec cp {} dist/modules/ \;
          echo "modules: $(ls dist/modules/*.ko | wc -l)"
          cp "$out/.config" dist/config-effective
          sha256sum dist/Image | tee dist/Image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.kernel || '7.2.8' }}
          path: dist

  equivalence:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kernel-${{ inputs.kernel || '7.2.8' }}
          path: dist
      - name: Equivalence gate
        run: |
          set -eu
          ver=$(strings dist/Image | sed -n 's/^Linux version \([^ ]*\) .*/\1/p' | head -1)
          case $ver in ${{ inputs.kernel || '7.2.8' }}*) echo "release ok: $ver" ;; *) echo "release mismatch: $ver" >&2; exit 1 ;; esac
          vm=$(strings "$(ls dist/modules/*.ko | head -1)" | grep -m1 '^vermagic=' || true)
          echo "vermagic: $vm"
          case $vm in vermagic=${{ inputs.kernel || '7.2.8' }}*) echo 'vermagic ok' ;; *) echo "vermagic mismatch" >&2; exit 1 ;; esac
          n=$(ls dist/modules/*.ko | wc -l)
          echo "modules built: $n"
          [ "$n" -ge 150 ] || { echo "too few modules: $n" >&2; exit 1; }
          echo 'gate passed'
