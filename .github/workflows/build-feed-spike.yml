name: feed spike (ImmortalWrt master + our external kernel tree)

# P2 spike(t17):证明「ImmortalWrt master buildroot + 我们的主线内核树(external kernel tree)
# → 完整 kmod apk feed」这条路可行,并拿到耗时/磁盘/冲突清单。纯 CI,不碰设备。
#
# 机制(已从源码核实):
#   config/Config-devel.in:152  config EXTERNAL_KERNEL_TREE(string, "Use external kernel tree" if DEVEL)
#   include/kernel-defaults.mk:38-46  外部树时 Kernel/Prepare = ln -s <tree> $(LINUX_DIR)(不下载、不 patch)
#   include/kernel.mk:67/73  外部树时 LINUX_UNAME_VERSION = cat $(LINUX_DIR)/include/config/kernel.release
#   include/kernel.mk:132    外部树时不再强加 KERNELRELEASE=$(LINUX_VERSION)
# ⇒ 我们的树必须在【树内】构建过:带 .config / include/config/kernel.release / Module.symvers。
#
# 触发:workflow_dispatch 只认【默认分支】上的工作流,所以本分支用 push 触发;
#       模式(stage1 / allkmods)从 .github/feed-spike-mode 读 —— 切换模式 = 改文件再 push。

on:
  push:
    branches: [qc/feed-ci]
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300          # 硬上限:不会无限挂死(GitHub 到点会取消 job)
    permissions:
      contents: write             # 完成信标要往 qc/spike-status 分支 push
    env:
      KV: 6.18.52
      STATUS_BRANCH: qc/spike-status
      GH_TOKEN: ${{ github.token }}
      MODE_FILE: .github/feed-spike-mode
      WORK: ${{ github.workspace }}/work
      IW: ${{ github.workspace }}/work/immortalwrt
      KTREE: ${{ github.workspace }}/work/kernel/linux-6.18.52
      NUM: ${{ github.workspace }}/work/NUMBERS.txt
    steps:
      - uses: actions/checkout@v4
      - name: 环境与磁盘(开始)
        run: |
          set -x
          MODE=$(cat "$MODE_FILE" 2>/dev/null || echo stage1); MODE=$(echo "$MODE" | tr -d '[:space:]')
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          mkdir -p "$WORK"
          echo "arch=$(uname -m) cpus=$(nproc) mode=$MODE kv=$KV" | tee -a "$NUM"
          df -h "$WORK" | tail -1 | tee -a "$NUM"; free -m | head -2 | tee -a "$NUM"
          echo "SPIKE-STAGE: env done $(date -u +%FT%TZ)" | tee -a "$NUM"
          # 注意:这一步里还不能调 beacon.sh(它在下一步"信标初始化"里才生成)
      - name: 信标初始化(开工 + 进度 + 5 分钟心跳)
        # 三个文件都在同一分支:
        #   LAST-START.txt   本 run 的开始(mode/commit/时间)
        #   PROGRESS.txt     本 run 的进度,每阶段前后各一行 + 心跳(某阶段 10 分钟无新行 = 疑似卡死)
        #   LAST-RUN.txt     上一次 run 的完成结果(本次开始时先抓下来保留)
        if: always()
        run: |
          set -x
          {
            echo "# feed-spike 最近一次 run 的开始"
            echo "run:      $GITHUB_RUN_ID"
            echo "run_url:  $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "branch:   $GITHUB_REF_NAME"
            echo "commit:   $GITHUB_SHA"
            echo "mode:     $MODE"
            echo "kv:       $KV"
            echo "started:  $(date -u +%FT%TZ)"
          } > "$WORK/LAST-START.txt"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$STATUS_BRANCH/feed-spike/LAST-RUN.txt" -o "$WORK/LAST-RUN.txt" 2>/dev/null || true
          {
            echo "# feed-spike 当前 run 的进度(run $GITHUB_RUN_ID;每阶段前后各一行 + 每 5 分钟一行心跳)"
            echo "# 读法:https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$STATUS_BRANCH/feed-spike/LAST-PROGRESS.txt"
          } > "$WORK/LAST-PROGRESS.txt"
          # 信标小工具(每个阶段前后调它;push 失败只打印一行,绝不影响 job)
          : > "$WORK/beacon.sh"
          echo '#!/bin/sh' >> "$WORK/beacon.sh"
          echo 'echo "[$(date -u +%H:%M:%SZ)] $* (run $GITHUB_RUN_ID)" >> "$WORK/LAST-PROGRESS.txt"' >> "$WORK/beacon.sh"
          echo 'echo "$*" > "$WORK/STAGE"' >> "$WORK/beacon.sh"
          echo 'R="$WORK/status-repo"' >> "$WORK/beacon.sh"
          echo 'mkdir -p "$R/feed-spike"' >> "$WORK/beacon.sh"
          echo 'for f in LAST-START.txt LAST-RUN.txt LAST-PROGRESS.txt; do [ -f "$WORK/$f" ] && cp "$WORK/$f" "$R/feed-spike/$f"; done' >> "$WORK/beacon.sh"
          echo 'cd "$R" || exit 0' >> "$WORK/beacon.sh"
          echo 'if [ ! -d .git ]; then git init -q -b "$STATUS_BRANCH"; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"; fi' >> "$WORK/beacon.sh"
          echo 'git add -A >/dev/null 2>&1' >> "$WORK/beacon.sh"
          echo 'git commit -q --amend -m "feed-spike status (run $GITHUB_RUN_ID)" >/dev/null 2>&1 || git commit -q -m "feed-spike status (run $GITHUB_RUN_ID)" >/dev/null 2>&1' >> "$WORK/beacon.sh"
          echo 'git push -q -f origin "HEAD:$STATUS_BRANCH" >/dev/null 2>&1 && echo "  [beacon] $*" || echo "  [beacon] push failed (ignored): $*"' >> "$WORK/beacon.sh"
          chmod +x "$WORK/beacon.sh"
          sh -n "$WORK/beacon.sh" && echo "beacon.sh 语法 OK" || echo "beacon.sh 语法有问题(不阻塞)"
          # 心跳:每 5 分钟一行,内容=当前阶段(便于区分"卡死"与"只是慢")
          ( while :; do sleep 300; sh "$WORK/beacon.sh" "heartbeat $(cat "$WORK/STAGE" 2>/dev/null)" >/dev/null 2>&1 || true; done ) &
          echo $! > "$WORK/heartbeat.pid"
          # 首推(之后每阶段前后各推一次)
          sh "$WORK/beacon.sh" "run-start mode=$MODE kv=$KV"
      - name: 构建依赖
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext libncurses-dev zlib1g-dev \
            file wget unzip rsync python3 python3-pip git subversion mercurial bzip2 gzip tar \
            time patch perl cpio curl ca-certificates bc flex bison libssl-dev device-tree-compiler
          echo "SPIKE-STAGE: deps done $(date -u +%FT%TZ)" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "deps-done"
      - name: "阶段2:shallow clone ImmortalWrt master"
        id: stage2
        run: |
          set -eo pipefail
          T0=$(date +%s)
          sh "$WORK/beacon.sh" "stage2-start clone-buildroot"
          git clone --depth 1 --branch master https://github.com/immortalwrt/immortalwrt.git "$IW"
          cd "$IW"
          echo "  buildroot head = $(git rev-parse --short HEAD)" | tee -a "$NUM"
          grep -o 'LINUX_VERSION-6.18 = .*' target/linux/generic/kernel-6.18 | tee -a "$NUM" || true
          T1=$(date +%s); echo "SPIKE-STAGE: buildroot cloned in $((T1-T0))s du=$(du -sh "$IW" | cut -f1)" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "buildroot-cloned-in-T1-T0-s-du=-du--sh"
      - name: "阶段1:准备我们的内核树(树内构建,供 external tree 使用)"
        id: stage1
        run: |
          set -eo pipefail
          sh "$WORK/beacon.sh" "stage1-start tree-prep"
          T0=$(date +%s); mkdir -p "$WORK/kernel"; cd "$WORK/kernel"
          base=https://cdn.kernel.org/pub/linux/kernel/v${KV%%.*}.x
          curl -fsSLO "$base/linux-$KV.tar.xz"
          curl -fsSL "$base/sha256sums.asc" | grep " linux-$KV.tar.xz\$" | sha256sum -c -
          tar -xJf linux-$KV.tar.xz && rm linux-$KV.tar.xz
          cd linux-$KV
          python3 "$GITHUB_WORKSPACE/upstream/port/install.py" .
          for p in "$GITHUB_WORKSPACE"/upstream/patches/*.patch; do
            if patch -p1 -N -s --dry-run < "$p" >/dev/null 2>&1; then patch -p1 -N -s < "$p"
            elif patch -p1 -R -s -f --dry-run < "$p" >/dev/null 2>&1; then :
            else echo "patch does not apply to $KV: $p" >&2; exit 1; fi
          done
          # ★ 关键:OpenWrt 的 generic hack 补丁(hack-6.18/*)必须叠到外部树上 —— 否则任何依赖这些
          # 补丁的出树包都编不过(run 36430322980:gpio-button-hotplug 缺 broadcast_uevent(),
          # 该符号由 target/linux/generic/hack-6.18/911-kobject_add_broadcast_uevent.patch 提供)。
          # 非致命:逐个尝试,统计成功/失败,失败的不影响本阶段(便于先拿到验证点 a/b)。
          hp_ok=0; hp_no=0; hp_list=
          for hp in "$IW"/target/linux/generic/hack-6.18/*.patch; do
            [ -f "$hp" ] || continue
            if patch -p1 -N -s --batch --forward < "$hp" >/dev/null 2>&1; then hp_ok=$((hp_ok+1)); else hp_no=$((hp_no+1)); hp_list="$hp_list $(basename "$hp")"; fi
          done
          echo "  OpenWrt hack 补丁:应用 $hp_ok 个,未应用 $hp_no 个" | tee -a "$NUM"
          [ -n "$hp_list" ] && echo "  未应用的:$hp_list" | tee -a "$NUM"
          if grep -q 'broadcast_uevent' include/linux/kobject.h; then
            echo "  验证:kobject.h 里已有 broadcast_uevent ✓(gpio-button-hotplug 这类包可以编了)" | tee -a "$NUM"
          else
            echo "  ⚠ 验证:kobject.h 里仍没有 broadcast_uevent(911 补丁没打上)" | tee -a "$NUM"
          fi
          make ARCH=arm64 allnoconfig >/dev/null
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/upstream/mu300-mainline.config" >/dev/null
          make ARCH=arm64 olddefconfig >/dev/null
          bad=
          while IFS= read -r l; do
            case "$l" in CONFIG_*=*) k=${l%%=*}; v=${l#*=}; g=$(grep -E "^$k=" .config | cut -d= -f2- || true)
              [ "$v" = n ] && { grep -q "^$k=y" .config && bad="$bad\nNOT DISABLED: $k" || true; continue; }
              [ "$g" = "$v" ] || grep -qx "$k" "$GITHUB_WORKSPACE/upstream/config-ignored.txt" 2>/dev/null || bad="$bad\nNOT SET: $k want $v got ${g:-unset}";; esac
          done < "$GITHUB_WORKSPACE/upstream/mu300-mainline.config"
          [ -z "$bad" ] || { printf "config options not taken:$bad\n" >&2; exit 1; }
          echo "SPIKE-STAGE: tree configured $(date -u +%FT%TZ)" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "tree-configured"
          make ARCH=arm64 -j"$(nproc)" Image modules > "$WORK/kernel/build.log" 2>&1 || { echo "SPIKE-FAILED-AT: kernel build"; tail -40 "$WORK/kernel/build.log"; exit 1; }
          {
            echo "  kernel.release = $(cat include/config/kernel.release)"
            echo "  tree config md5(LINUX_VERMAGIC 口径)= $(grep '=[ym]' .config | LC_ALL=C sort | md5sum | cut -d' ' -f1)"
            echo "  官方 armsr 6.18.52 的 md5 = 2e107f3f74eefa4459193e9332551c74(预期【不同】:配置不同)"
          } | tee -a "$NUM"
          for k in drivers/net/ppp/pppoe.ko net/sched/sch_netem.ko drivers/block/nbd.ko drivers/vhost/vhost_net.ko; do
            [ -f "$k" ] && printf '    %-34s %s\n' "$k" "$(strings $k | sed -n 's/^vermagic=\(.*\)/\1/p' | head -1)" | tee -a "$NUM"
          done
          T1=$(date +%s); echo "SPIKE-STAGE: tree built in $((T1-T0))s du=$(du -sh "$WORK/kernel" | cut -f1)" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "tree-built-in-T1-T0-s-du=-du--sh"
          df -h "$WORK" | tail -1 | tee -a "$NUM"
      - name: "阶段3:buildroot 配置(armsr/armv8 + DEVEL + external tree + 选包)"
        id: stage3
        run: |
          set -eo pipefail
          cd "$IW"
          sh "$WORK/beacon.sh" "stage3-start config"
          make defconfig >/dev/null
          {
            echo 'CONFIG_TARGET_armsr=y'
            echo 'CONFIG_TARGET_armsr_armv8=y'
            echo 'CONFIG_TARGET_armsr_armv8_DEVICE_generic=y'
            echo 'CONFIG_DEVEL=y'
            echo "CONFIG_EXTERNAL_KERNEL_TREE=\"$KTREE\""
            [ "$MODE" = "allkmods" ] && echo 'CONFIG_ALL_KMODS=y'
            # 不再需要"关掉 gpio-button-hotplug":根因是缺 OpenWrt 的 generic hack 补丁,
            # 阶段1 现在会把 hack-6.18/*.patch 叠到我们的树上一并解决(见 stage1)。
            for p in kmod-pppoe kmod-pppox kmod-nbd kmod-vhost-net kmod-sch-netem kmod-sch-hhf kmod-sch-sfb \
                     kmod-sch-drr kmod-sch-qfq kmod-sch-pie kmod-cls-flower kmod-nfnetlink-acct \
                     kmod-tun kmod-nf-nat kmod-nf-nathelper kmod-sched-cake kmod-wireguard; do
              echo "CONFIG_PACKAGE_$p=m"
            done
          } >> .config
          make defconfig >/dev/null
          echo "--- external tree / DEVEL / ALL_KMODS / target 生效情况 ---"
          grep -E '^(CONFIG_EXTERNAL_KERNEL_TREE|CONFIG_DEVEL|CONFIG_ALL_KMODS|CONFIG_TARGET_armsr)' .config | tee -a "$NUM"
          echo "--- 实际留下的 kmod 包 ---"
          grep -E '^CONFIG_PACKAGE_kmod-' .config | tee "$WORK/selected-kmods.txt" | head -40
          echo "  选中 $(wc -l < "$WORK/selected-kmods.txt") 个"
          echo "SPIKE-STAGE: config done $(date -u +%FT%TZ)" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "config-done"
      - name: "阶段4:编内核 + kmod 包 + feed 索引(计时/磁盘)"
        id: stage4
        run: |
          set -eo pipefail
          cd "$IW"
          T0=$(date +%s)
          df -h "$WORK" | tail -1 | tee -a "$NUM"
          # 上一轮教训:buildroot 生成签名密钥要用它自己的 host openssl(package/Makefile:78),
          # 而 host 工具默认不编 ⇒ 必须先把 tools 装上(Error 127 / private-key.pem)。
          sh "$WORK/beacon.sh" "stage4-start tools/install"
          make -j"$(nproc)" tools/install V=s > "$WORK/buildroot-tools.log" 2>&1 || {
            echo "SPIKE-FAILED-AT: tools/install" | tee -a "$NUM"; tail -40 "$WORK/buildroot-tools.log"; exit 1; }
          Tt=$(date +%s); echo "SPIKE-STAGE: host tools in $((Tt-T0))s" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "host-tools-in-Tt-T0-s"
          # 上一轮(run 36420475944)教训:直接 package/kernel/linux/compile 时,package/libs/toolchain 打包
          # libgcc1-*.apk 会因为 staging_dir/toolchain-*/lib/libgcc_s.so.* 不存在而失败 ⇒ 必须先把【完整工具链】
          # 建出来(make toolchain/install),再编内核与 kmod。
          sh "$WORK/beacon.sh" "stage4-start toolchain/install"
          make -j"$(nproc)" toolchain/install V=s > "$WORK/buildroot-toolchain.log" 2>&1 || {
            echo "SPIKE-FAILED-AT: toolchain/install" | tee -a "$NUM"; tail -40 "$WORK/buildroot-toolchain.log"; exit 1; }
          Tc=$(date +%s); echo "SPIKE-STAGE: toolchain in $((Tc-Tt))s" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "stage4-start target/linux/compile"
          make -j"$(nproc)" target/linux/compile V=s >> "$WORK/buildroot.log" 2>&1 || {
            echo "SPIKE-FAILED-AT: target/linux/compile" | tee -a "$NUM"; tail -60 "$WORK/buildroot.log"; exit 1; }
          Tk=$(date +%s); echo "SPIKE-STAGE: kernel(target/linux) in $((Tk-Tc))s" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "stage4-start package/kernel/linux/compile"
          make -j"$(nproc)" package/kernel/linux/compile V=s > "$WORK/buildroot.log" 2>&1 || {
            echo "SPIKE-FAILED-AT: package/kernel/linux/compile" | tee -a "$NUM"; tail -60 "$WORK/buildroot.log"
            grep -n -E 'Error [0-9]|error:|ERROR|No rule to make target' "$WORK/buildroot.log" | head -30 || true; exit 1; }
          T1=$(date +%s); echo "SPIKE-STAGE: kernel+kmods compiled in $((T1-T0))s" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "stage4-start package/index"
          make -j"$(nproc)" package/index V=s >> "$WORK/buildroot.log" 2>&1 || { echo "SPIKE-FAILED-AT: package/index" | tee -a "$NUM"; tail -30 "$WORK/buildroot.log"; exit 1; }
          T2=$(date +%s); echo "SPIKE-STAGE: index in $((T2-T1))s" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "index-in-T2-T1-s"
          du -sh bin build_dir staging_dir dl 2>/dev/null | tee -a "$NUM" || true
          df -h "$WORK" | tail -1 | tee -a "$NUM"
      - name: "阶段5:收集 feed + 关键验证点"
        id: stage5
        run: |
          set -e
          cd "$IW"
          {
          sh "$WORK/beacon.sh" "stage5-start collect-verify"
            echo "=== .apk 总数: $(find bin -name '*.apk' | wc -l)"
            echo "=== index 文件 ==="; find bin -name 'packages.adb' | head -10
            echo "=== 验证 a:kernel 包(版本应为 6.18.52~<我们 config md5>-r1)==="
            find bin -path '*packages*' -name 'kernel-*.apk' | head -5
            echo "=== 验证 b:我们树里 buildroot 编出的 .ko 的 vermagic ==="
          } | tee -a "$NUM"
          for k in $(find "$KTREE" -name 'pppoe.ko' -o -name 'sch_netem.ko' -o -name 'nbd.ko' -o -name 'vhost_net.ko' 2>/dev/null | head -6); do
            printf '  %-72s %s\n' "$k" "$(strings "$k" | sed -n 's/^vermagic=\(.*\)/\1/p' | head -1)" | tee -a "$NUM"
          done
          echo "=== 验证 c:磁盘 ===" | tee -a "$NUM"
          du -sh build_dir staging_dir dl bin 2>/dev/null | tee -a "$NUM" || true
          echo "SPIKE-STAGE: done $(date -u +%FT%TZ)" | tee -a "$NUM"
          sh "$WORK/beacon.sh" "done"
      - name: 上传 feed 与数字
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-spike-output
          if-no-files-found: warn
          path: |
            work/NUMBERS.txt
            work/selected-kmods.txt
            work/buildroot.log
            work/kernel/build.log
            work/immortalwrt/bin/targets/armsr/armv8/packages/
            work/immortalwrt/bin/packages/
      - name: 失败时给出日志尾部
        if: failure()
        run: |
          echo "=== NUMBERS.txt ==="; cat "$NUM" || true
          echo "=== buildroot.log 尾部 ==="; tail -50 "$WORK/buildroot.log" || true
      - name: 完成信标(always:把结果推到 qc/spike-status)
        # 目的:Actions 没人盯 —— run 结束后,主机侧直接读
        #   https://raw.githubusercontent.com/<repo>/qc/spike-status/feed-spike/LAST-RUN.txt
        # 就知道结论与阶段数字,不依赖 API(免限流)。
        if: always()
        env:
          STATUS_BRANCH: qc/spike-status
        run: |
          kill "$(cat "$WORK/heartbeat.pid" 2>/dev/null)" 2>/dev/null || true   # 先停心跳,免得它把旧内容又推上去
          OUT="$GITHUB_WORKSPACE/LAST-RUN.txt"
          {
            echo "# feed-spike 最近一次 run 的结果"
            echo "repo:      $GITHUB_REPOSITORY"
            echo "run:       $GITHUB_RUN_ID"
            echo "run_url:   $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "branch:    $GITHUB_REF_NAME"
            echo "commit:    $GITHUB_SHA"
            echo "mode:      $MODE"
            echo "kv:        $KV"
            echo "status:    ${{ job.status }}"
            echo "finished:  $(date -u +%FT%TZ)"
            echo "steps:     stage1=${{ steps.stage1.outcome }} stage2=${{ steps.stage2.outcome }} stage3=${{ steps.stage3.outcome }} stage4=${{ steps.stage4.outcome }} stage5=${{ steps.stage5.outcome }}"
            echo
            echo "## 阶段打点(SPIKE-STAGE / SPIKE-FAILED-AT)"
            grep -hE 'SPIKE-STAGE|SPIKE-FAILED-AT' "$NUM" 2>/dev/null || echo "(无打点:可能阶段1之前就失败)"
            echo
            echo "## 关键验证线索"
            grep -hE 'kernel-[0-9.]+~[0-9a-f]+-r[0-9]+\.apk|vermagic|config md5|apk 总数|generating empty package|EXTRA_DEPENDS' "$NUM" 2>/dev/null || true
            if [ -f "$WORK/buildroot.log" ]; then
              echo
              echo "## buildroot.log 尾 20 行"
              tail -20 "$WORK/buildroot.log"
            fi
          } > "$OUT" 2>&1 || true
          echo "=== LAST-RUN.txt ==="; cat "$OUT" || true
          D=$(mktemp -d)
          if git clone -q --depth 1 -b "$STATUS_BRANCH" "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" "$D" 2>/dev/null; then :; else
            mkdir -p "$D"; cd "$D"; git init -q -b "$STATUS_BRANCH"
          fi
          cd "$D"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p feed-spike && cp "$OUT" feed-spike/LAST-RUN.txt
          git add feed-spike/LAST-RUN.txt
          git commit -q -m "feed-spike status: run $GITHUB_RUN_ID (${{ job.status }})"
          # origin 已由上面的 clone 带好(含 token),不要再 add(否则 remote origin already exists → exit 3)
          if git push -q -f origin "HEAD:$STATUS_BRANCH"; then
            echo "信标已推送:$STATUS_BRANCH/feed-spike/LAST-RUN.txt"
          else
            echo "★ 信标推送失败(不影响本 job 的结论)"
          fi
