name: ImmortalWrt image

# Repacks our ImmortalWrt rootfs into the Magisk installer. The BASE is our own released
# rootfs: it already carries the reference port layer (mu300-api, the panel views, the
# newer services). Rebuilding from the stock build-rootfs.sh would produce the author line
# without that layer, which is what the previous runs did.

on:
  workflow_dispatch:
    inputs:
      base_rootfs_url:
        description: 'ImmortalWrt rootfs tarball to repack (our release asset)'
        required: false
        default: ''
      base_rootfs_sha256:
        description: 'Expected sha256 of that tarball'
        required: false
        default: ''
      base_zip_url:
        description: 'Release package that carries the installer payload'
        required: false
        default: ''
      base_tag:
        description: 'Release whose rootfs and module zip are the base (it must carry both assets)'
        required: false
        default: 'v2026.10.24.7'
      tag:
        description: 'Release tag to publish this build under (empty: do not publish)'
        required: false
        default: ''
      theme:
        description: 'Theme variant of this build: aurora (default) or argon' 
        required: false
        default: 'aurora'
      version:
        description: 'Image version string'
        required: false
        default: 'ci'
  push:
    branches: ['local/immortalwrt-ci']
    paths: ['.github/workflows/immortalwrt.yml', 'tools/ci-repack-module.py', 'tools/ci-postbuild.sh']

permissions:
  contents: write   # the Publish step creates/updates the release

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Docker present
        run: docker info >/dev/null
      - name: Fetch the base rootfs (our build, with the reference feature layer)
        env:
          URL: ${{ inputs.base_rootfs_url || format('https://github.com/QC3284/mu300-linux/releases/download/{0}/mu300-openwrt-rootfs.tar.gz', inputs.base_tag || 'v2026.10.24.7') }}
          SHA: ${{ inputs.base_rootfs_sha256 || '' }}
        run: |
          set -eu
          mkdir -p openwrt
          curl -fsSL "$URL" -o openwrt/mu300-immortalwrt-base.tar.gz
          echo "base rootfs sha256: $(sha256sum openwrt/mu300-immortalwrt-base.tar.gz | cut -d" " -f1)"
          [ -z "$SHA" ] || echo "$SHA  openwrt/mu300-immortalwrt-base.tar.gz" | sha256sum -c -
          echo "  mu300-api files: $(tar tzf openwrt/mu300-immortalwrt-base.tar.gz | grep -c 'opt/mu300/bin/mu300-api$')"
          echo "  panel views: $(tar tzf openwrt/mu300-immortalwrt-base.tar.gz | grep -c 'view/mu300/.*\.js$')"
          echo "  mu300 services: $(tar tzf openwrt/mu300-immortalwrt-base.tar.gz | grep -c 'etc/init.d/mu300-')"
      - name: Theme variant
        env:
          THEME: ${{ inputs.theme || 'aurora' }}
        run: |
          set -eu
          case "$THEME" in
            aurora) echo "aurora: already the image own theme, nothing to add" ; exit 0 ;;
            argon) ;;
            *) echo "unknown theme: $THEME" >&2 ; exit 2 ;;
          esac
          # One firmware, one theme set: the argon variant installs argon + its config plugin, the aurora variant stays
          # lean. The runner is arm64, so the rootfs binaries run under chroot and its own apk (SJTU mirror) is used.
          R=$PWD/theme-root
          rm -rf "$R" && mkdir -p "$R"
          tar -xzf openwrt/mu300-immortalwrt-base.tar.gz -C "$R"
          rm -f "$R/etc/resolv.conf"   # the image ships a symlink to /tmp/resolv.conf
          cp /etc/resolv.conf "$R/etc/resolv.conf"
          sudo chroot "$R" /bin/sh -c "apk update && apk add luci-theme-argon luci-app-argon-config"
          rm -f "$R/etc/resolv.conf"
          ln -sfn /tmp/resolv.conf "$R/etc/resolv.conf"
          tar --owner=0 --group=0 --exclude=./lib/apk/exec --exclude=./tmp/* -czf openwrt/mu300-immortalwrt-base.tar.gz -C "$R" .
          sudo rm -rf "$R"
          echo "argon files: $(tar tzf openwrt/mu300-immortalwrt-base.tar.gz | grep -c luci-static/argon || true)"
      - name: Stamp the release tag into the image
        if: ${{ inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          # image-version (and the manifest head that names it) must equal the release tag, or the update path refuses
          # the image and a fingerprint of the installed build is useless.
          R=$PWD/stamp-root
          rm -rf "$R" && mkdir -p "$R"
          tar -xzf openwrt/mu300-immortalwrt-base.tar.gz -C "$R"
          printf '%s\n' "$TAG" > "$R/etc/mu300/image-version"
          tar --owner=0 --group=0 -czf /tmp/stamp-stage.tar.gz -C "$R" .
          python3 tools/image-manifest.py make /tmp/stamp-stage.tar.gz openwrt-luci "$TAG" 2>/dev/null | gzip -9 > "$R/etc/mu300/image-manifest.gz"
          tar --owner=0 --group=0 --exclude=./lib/apk/exec -czf openwrt/mu300-immortalwrt-base.tar.gz -C "$R" .
          sudo rm -rf "$R" /tmp/stamp-stage.tar.gz
          echo "image-version: $(tar xzOf openwrt/mu300-immortalwrt-base.tar.gz ./etc/mu300/image-version)"
      - name: Post-build pass (SSH, password, dropbear off, ownership)
        run: |
          set -eu
          chmod +x tools/ci-postbuild.sh
          sudo tools/ci-postbuild.sh openwrt/mu300-immortalwrt-base.tar.gz
          sha256sum openwrt/mu300-immortalwrt-base.tar.gz
      - name: Repack the Magisk installer with our rootfs
        env:
          BASE_ZIP: ${{ inputs.base_zip_url || format('https://github.com/QC3284/mu300-linux/releases/download/{0}/mu300-linux-immortalwrt-tf-7.2.zip', inputs.base_tag || 'v2026.10.24.7') }}
          THEME: ${{ inputs.theme || 'aurora' }}
        run: |
          set -eu
          curl -fsSL "$BASE_ZIP" -o /tmp/base.zip
          rm -rf build
          mkdir -p build/base build/out
          unzip -q /tmp/base.zip -d build/base
          cp openwrt/mu300-immortalwrt-base.tar.gz build/base/payload/mu300-openwrt.tar.gz
          python3 tools/ci-repack-module.py build/base/payload
          cd build/base
          zip -q -r ../out/mu300-linux-immortalwrt-tf-7.2.zip .
          cd ../out
          SUF=""
          [ "${THEME:-aurora}" = aurora ] || SUF="-${THEME}"
          if [ -n "$SUF" ]; then mv mu300-linux-immortalwrt-tf-7.2.zip "mu300-linux-immortalwrt-tf-7.2${SUF}.zip"; fi
          sha256sum *.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mu300-immortalwrt-image-${{ inputs.theme || 'aurora' }}
          path: |
            build/out/*.zip
            build/out/SHA256SUMS
      - name: Publish (when a tag was given)
        if: ${{ inputs.tag != '' }}
        env:
          TAG: ${{ inputs.tag }}
          THEME: ${{ inputs.theme || 'aurora' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # One plain numeric tag per variant; the theme shows in the asset names only, because mu300-update tag_ok
          # accepts vYYYY.MM.DD[.N] and would refuse a suffix.
          cd build/out
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "ImmortalWrt image $TAG ($THEME theme)" \
            --notes "Theme variant: $THEME." 
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *.zip SHA256SUMS
